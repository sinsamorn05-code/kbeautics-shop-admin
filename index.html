<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-BEAUTICS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#c2557a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KB Admin">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1b1d22;--muted:#6b7280;--line:#e5e7eb;
  --brand:#c2557a;--brand-ink:#fff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa1ab;--line:#2a2f37}
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Kantumruy Pro",-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .box{background:var(--card);padding:28px;border-radius:var(--radius);width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
#login h1{margin:0 0 4px;font-size:22px}
.logo{color:var(--brand);font-weight:800;letter-spacing:.5px}
/* shell */
#app{display:flex;min-height:100vh}
nav{width:220px;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
nav .logo{font-size:18px;padding:4px 10px 16px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px;position:relative}
nav a:hover{background:rgba(194,85,122,.08)}
nav a .nl{flex:1}
nav .ni{width:19px;height:19px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav .logo{display:flex;align-items:center;gap:8px}
nav a.active{background:var(--brand);color:#fff}
nav a .pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
nav a.active .pill{background:#fff;color:var(--brand)}
nav .foot{margin-top:20px;padding:10px 12px;font-size:12px;color:var(--muted)}
main{flex:1;padding:20px;min-width:0}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.top h2{margin:0;font-size:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{width:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat .n{font-size:26px;font-weight:700;margin-top:4px}
.stat .l{color:var(--muted);font-size:13px}
.stat.click{cursor:pointer}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(127,127,127,.06)}
.tablewrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e5e7eb;color:#374151}
.b-pending_payment,.b-pending{background:#fef3c7;color:#92400e}
.b-payment_review{background:#fde68a;color:#78350f}
.b-paid,.b-deposit_paid,.b-approved,.b-accepted,.b-delivered{background:#dcfce7;color:#166534}
.b-ordered_taobao,.b-shipping,.b-quoted{background:#dbeafe;color:#1e40af}
.b-arrived,.b-ready{background:#ede9fe;color:#5b21b6}
.b-cancelled,.b-rejected{background:#fee2e2;color:#991b1b}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--line)}
.muted{color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;margin-top:12px}
.check input{width:auto}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:var(--radius);width:100%;max-width:640px;padding:20px}
#modal h3{margin:0 0 6px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.section{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.section h4{margin:0 0 8px;font-size:14px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgs .im{position:relative}
.imgs img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.imgs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--bad);color:#fff;border-radius:99px;width:20px;height:20px;cursor:pointer;font-size:12px}
.slip{max-width:100%;max-height:460px;border-radius:8px;display:block;margin:8px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px}
a.link{color:var(--info);overflow-wrap:anywhere}
/* mobile */
@media (max-width:760px){
  #app{flex-direction:row}
  nav{width:74px;height:100vh;height:100dvh;position:sticky;top:0;z-index:10;overflow-y:auto;padding:8px 5px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav .foot,nav .logo .lt{display:none!important}
  nav .logo{justify-content:center;padding:4px 0 10px!important}
  nav .logo img{width:34px!important}
  nav a{flex-direction:column;justify-content:center;gap:3px;padding:9px 2px;text-align:center;font-size:10.5px;line-height:1.2}
  nav a .nl{flex:none}
  nav .ni{width:21px;height:21px}
  nav a .pill{position:absolute;top:3px;right:9px;font-size:10px;padding:0 5px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat .n{font-size:20px}
  .card{padding:12px}
  main{padding:12px;min-width:0}
  th,td{padding:8px 6px;font-size:13px}
  .badge{white-space:nowrap;font-size:11px}
  .top h2{font-size:18px}
  .row{grid-template-columns:1fr}
  .hide-m{display:none}
}

/* orders — K-TRONiCS style */
:root{--k-gr:#1E7A45;--k-grs:#E3F4EA;--k-or:#A14A06;--k-ors:#FDF0E1;--k-rd:#B42318;--k-rds:#FDE8E6;--k-bl:#1D5FB8;--k-bls:#E4EEFB;--k-pu:#6D28D9;--k-pus:#EFE7FD}
@media (prefers-color-scheme: dark){:root{--k-gr:#4ADE80;--k-grs:#10291B;--k-or:#F5A524;--k-ors:#33230F;--k-rd:#F87171;--k-rds:#3A1416;--k-bl:#7FB2FF;--k-bls:#132238;--k-pu:#C4B5FD;--k-pus:#251a3d}}
.kchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.kchips::-webkit-scrollbar{display:none}
.kchip{height:34px;padding:0 14px;border-radius:999px;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--text);white-space:nowrap;cursor:pointer}
.kchip span{opacity:.7;margin-left:2px}.kchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ksearch input{width:100%;height:44px;border-radius:12px}
.kkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kstat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.kstat b{display:block;font-size:21px}.kstat span{font-size:12px;color:var(--muted)}
.kstat .gr{color:var(--k-gr)}.kstat .or{color:var(--k-or)}.kstat .rd{color:var(--k-rd)}
.ksum{font-size:13px;margin:0 2px 8px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.kcard.flush{padding:0;gap:0;overflow:hidden}
.kitem{display:flex;align-items:center;gap:12px;padding:12px 14px}.kitem+.kitem{border-top:1px solid var(--line)}
.kopen{border:0;background:none;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer;min-width:0}
.ktt{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kst{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.kright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.knext{width:96px;flex-shrink:0}
.grow{flex:1;min-width:0}
.kpill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.kpill.gr{background:var(--k-grs);color:var(--k-gr)}.kpill.or{background:var(--k-ors);color:var(--k-or)}.kpill.rd{background:var(--k-rds);color:var(--k-rd)}
.kpill.bl{background:var(--k-bls);color:var(--k-bl)}.kpill.pu{background:var(--k-pus);color:var(--k-pu)}
.kbtn{text-decoration:none;height:48px;border-radius:12px;font:inherit;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--brand);color:#fff;padding:0 18px;cursor:pointer}
.kbtn:disabled{opacity:.55}.kbtn.green{background:var(--k-gr)}.kbtn.out{background:var(--card);color:var(--text);border:1px solid var(--line)}
.kbtn.red{background:var(--card);color:var(--k-rd);border:1px solid #F1C4BF}.kbtn.sm{height:38px;font-size:13px;padding:0 12px;border-radius:10px}
.kbtns{display:flex;gap:10px;flex-wrap:wrap}.kbtns>*{flex:1}
.ksheet{display:flex;flex-direction:column;gap:12px}.ksh{font-size:17px;font-weight:800}
.krow{display:flex;align-items:center;gap:12px}.kbig{font-size:26px;font-weight:800}
.kpaybar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.kpaybar>div{height:100%;background:var(--k-gr);border-radius:99px}
.kplist{margin:0 -14px;border-top:1px solid var(--line)}.kpay{padding:10px 14px}.kpay+.kpay{border-top:1px solid var(--line)}
.kcol{display:flex;flex-direction:column;gap:8px}.knote{background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
@media (max-width:640px){.knext{display:none}.kkpis{grid-template-columns:1fr 1fr 1fr}.kstat{padding:10px}.kstat b{font-size:16px}}
</style>
</head>

  deposit_paid:'Deposit paid', ordered_taobao:'Ordered from supplier', shipping:'Shipping to KH',
  arrived:'Arrived', ready:'Ready to deliver', delivered:'Delivered', cancelled:'Cancelled'
};
const ORDER_TYPE = {stock:'Normal', preorder:'Pre-order', taobao_link:'Special order'};
const REQ_STATUS = {pending:'New', quoted:'Quoted', accepted:'Accepted', rejected:'Rejected', cancelled:'Cancelled'};

// ====== HELPERS ======
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toFixed(2);
const toLocalInput = iso => { const d = new Date(iso); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16); };
const dt = d => d ? fmtD(d,{t:1}) : '';
const badge = (s, map) => `<span class="badge b-${esc(s)}">${esc((map||{})[s] || s)}</span>`;
const custName = c => c ? esc([c.first_name, c.last_name].filter(Boolean).join(' ') || (c.username ? '@'+c.username : 'Customer')) : '—';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.add('hidden'),2600); }
function openModal(html){ $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); $('#mbox').innerHTML=''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function fail(error){ if(error){ console.error(error); toast('Error: ' + error.message); return true; } return false; }
async function uploadImage(file, folder='products'){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('product-images').upload(path, file, { contentType: file.type });
  if (fail(error)) return null;
  return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

// ====== AUTH ======
async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok){ await sb.auth.signOut(); return showLogin('This account is not an admin.'); }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = session.user.email;
  ME = (await sb.from('admin_users').select('*').eq('user_id', session.user.id).maybeSingle()).data;
  go(location.hash.slice(1) || 'dashboard');
  refreshPills();
}
function showLogin(msg=''){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); $('#lErr').textContent = msg; }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#lBtn').disabled = true; $('#lErr').textContent='';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
  $('#lBtn').disabled = false;
  if (error) return $('#lErr').textContent = error.message;
  start();
});
$('#logout').onclick = async () => { await sb.auth.signOut(); showLogin(); };

const PAGES = { dashboard, orders, payments, requests, products, banners, categories, customers, reports, settings, admins };
let ME = null;
let page = 'dashboard';
function go(p){
  if (!PAGES[p]) p = 'dashboard';
  page = p; location.hash = p;
  document.querySelectorAll('nav a[data-p]').forEach(a => a.classList.toggle('active', a.dataset.p === p));

  PAGES[p]();
}
document.querySelectorAll('nav a[data-p]').forEach(a => a.onclick = () => go(a.dataset.p));
async function refreshPills(){
  const [p, r] = await Promise.all([
    sb.from('payments').select('id',{count:'exact',head:true}).eq('status','pending'),
    sb.from('taobao_requests').select('id',{count:'exact',head:true}).eq('status','pending')
  ]);
  const set = (el, n) => { el.textContent = n; el.classList.toggle('hidden', !n); };
  set($('#pPay'), p.count||0); set($('#pReq'), r.count||0);
}

      <div class="card stat click" onclick="REP.p='month';go('reports')"><div class="l">Profit this month</div><div class="n" style="color:${(pM?.profit||0)<0?'var(--bad)':'var(--ok)'}">${money(pM?.profit||0)}</div><div class="muted" style="font-size:12px">Sales ${money(pM?.sales||0)} · ${pM?.orders||0} orders</div></div>
      ${stat(money(income),'Money received today')}

      ${stat(reqs,'New requests','requests')}
      ${stat(waiting,'Waiting for payment','orders','pending_payment')}
      ${stat(toOrder,'Deposit paid — order from supplier','orders','deposit_paid')}
      ${stat(shipping,'Ordered / shipping','orders')}
      ${stat(ready,'Paid — to deliver','orders')}
    </div>
    <div class="card"><h3 style="margin-top:0">Latest orders</h3><div id="latest" class="tablewrap"></div></div>`;

  $('#latest').innerHTML = orderTable(data||[]);

// ====== ORDERS ======
const r2 = n => Math.round(Number(n) * 100) / 100;
async function myId(){ return (await sb.auth.getUser()).data.user.id; }
// paid amount = sum of approved payments
async function recalcPaid(orderId){
  const { data } = await sb.from('payments').select('amount_usd').eq('order_id', orderId).eq('status', 'approved');
  const paid = r2((data||[]).reduce((s,x)=>s+Number(x.amount_usd),0));
  await sb.from('orders').update({ paid_usd: paid }).eq('id', orderId);
  return paid;
}

function orderTable(rows){
  if (!rows.length) return '<div class="empty">No orders yet</div>';
  return `<table><thead><tr><th>Order</th><th>Customer</th><th class="hide-m">Type</th><th>Status</th><th>Total</th><th class="hide-m">Paid</th><th class="hide-m">Date</th></tr></thead><tbody>
  ${rows.map(o=>`<tr class="click" onclick="orderDetail(${o.id})"><td><b>${esc(o.order_no)}</b></td><td>${custName(o.customers)}</td><td class="hide-m">${esc(ORDER_TYPE[o.order_type])}</td><td>${badge(o.status,ORDER_STATUS)}</td><td>${money(o.total_usd)}</td><td class="hide-m">${money(o.paid_usd)}</td><td class="hide-m muted">${dt(o.created_at)}</td></tr>`).join('')}
  </tbody></table>`;
}
// ====== ORDERS — same layout as the K-TRONiCS app (Sales / POS) ======
const STAGES = {
  new:       { label:'New',       pill:'or', st:['pending_payment','payment_review'] },
  confirmed: { label:'Confirmed', pill:'bl', st:['paid','deposit_paid','ordered_taobao','arrived','ready'] },
  shipping:  { label:'Shipping',  pill:'pu', st:['shipping'] },
  delivered: { label:'Delivered', pill:'gr', st:['delivered'] },
  cancelled: { label:'Cancelled', pill:'rd', st:['cancelled'] }
};
const stageOf = st => Object.keys(STAGES).find(k => STAGES[k].st.includes(st)) || 'new';
const stagePill = st => { const g = STAGES[stageOf(st)]; return `<span class="kpill ${g.pill}">${g.label}</span>`; };
const balanceOf = o => r2(Number(o.total_usd) - Number(o.paid_usd));
const noPriceItems = o => (o.order_items||[]).filter(i => !(Number(i.unit_price_usd) > 0));
const NEXT = { new:['confirmed','Confirm','green'], confirmed:['shipping','Shipping',''], shipping:['delivered','Delivered','green'] };
// status saved in the database for "Confirmed", based on what was paid
const prepStatus = o => (Number(o.paid_usd) >= Number(o.total_usd) && Number(o.total_usd) > 0) ? 'paid' : Number(o.paid_usd) > 0 ? 'deposit_paid' : 'ready';
async function setStage(id, stage, ask=false){
  const { data:o, error } = await sb.from('orders').select('id,order_no,status,total_usd,paid_usd').eq('id', id).single(); if (fail(error)) return false;
  if (ask && !confirm(`${o.order_no}: ${STAGES[stage].label}?`)) return false;
  const status = stage === 'new' ? 'pending_payment' : stage === 'confirmed' ? prepStatus(o) : stage;
  const r = await sb.from('orders').update({ status }).eq('id', id); if (fail(r.error)) return false;
  refreshPills(); return true;
}
const custOf = o => o.contact_name || [o.customers?.first_name, o.customers?.last_name].filter(Boolean).join(' ') || (o.customers?.username ? '@'+o.customers.username : 'Customer');
function rightPill(o){
  if (noPriceItems(o).length) return `<span class="kpill or">Price not set</span>`;
  if ((o.payments||[]).some(p => p.status === 'pending')) return `<span class="kpill or">Slip to check</span>`;
  const bal = balanceOf(o);
  if (stageOf(o.status) !== 'cancelled' && Number(o.paid_usd) > 0 && bal > 0) return `<span class="kpill or">${money(bal)} left</span>`;
  return stagePill(o.status);
}
let OTAB = 'all';
async function orders(){
  $('#main').innerHTML = `
    <div class="top"><h2>Orders</h2><button class="btn primary" onclick="newOrder()">+ New order</button></div>
    <div class="kchips" id="chips"></div>
    <div class="ksearch"><input id="fSearch" placeholder="🔍 Search order, name or phone"></div>
    <div class="kkpis" id="kpis"></div>
    <div class="ksum muted" id="sum"></div>
    <div class="kcard flush" id="olist"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from('orders')
    .select('id,order_no,status,order_type,created_at,total_usd,paid_usd,contact_name,contact_phone,customers(first_name,last_name,username),order_items(qty,unit_price_usd),payments(status)')
    .order('created_at',{ascending:false}).limit(1000);
  if (fail(error)) return;
  const all = data || [];
  const draw = () => {
    const t = $('#fSearch').value.trim().toLowerCase();
    const base = all.filter(o => !t || [o.order_no, custOf(o), o.contact_phone, o.customers?.username].some(x => String(x||'').toLowerCase().includes(t)));
    const inTab = (o, k) => k === 'all' ? stageOf(o.status) !== 'cancelled' : stageOf(o.status) === k;
    $('#chips').innerHTML = [['all','All'], ...Object.entries(STAGES).map(([k,g]) => [k, g.label])]
      .map(([k,l]) => `<button class="kchip ${OTAB===k?'on':''}" data-f="${k}">${l} <span>${base.filter(o => inTab(o,k)).length}</span></button>`).join('');
    $('#chips').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { OTAB = b.dataset.f; draw(); });
    const month = new Date().toISOString().slice(0,7);
    const sold = all.filter(o => ['confirmed','shipping','delivered'].includes(stageOf(o.status)) && o.created_at.slice(0,7) === month).reduce((a,o) => a + Number(o.total_usd), 0);
    const waiting = all.filter(o => stageOf(o.status) === 'new').reduce((a,o) => a + Number(o.total_usd), 0);
    const owed = all.filter(o => !['new','cancelled'].includes(stageOf(o.status))).reduce((a,o) => a + Math.max(0, balanceOf(o)), 0);
    $('#kpis').innerHTML = `<div class="kstat"><b class="gr">${money(sold)}</b><span>Sales this month</span></div><div class="kstat"><b class="or">${money(waiting)}</b><span>Waiting to confirm</span></div><div class="kstat"><b class="rd">${money(owed)}</b><span>Still owed by customers</span></div>`;
    const list = base.filter(o => inTab(o, OTAB));
    $('#sum').textContent = `${list.length} orders · ${money(list.reduce((a,o)=>a+Number(o.total_usd),0))}`;
    $('#olist').innerHTML = !list.length ? '<div class="empty">No orders here</div>' : list.slice(0, 300).map(o => {
      const nx = NEXT[stageOf(o.status)], n = (o.order_items||[]).reduce((a,i)=>a+Number(i.qty),0);
      return `<div class="kitem">
        <button class="grow kopen" data-open="${o.id}"><div class="ktt">${esc(o.order_no)} · ${esc(custOf(o))}</div>
          <div class="kst">${o.contact_phone?esc(o.contact_phone)+' · ':''}${dt(o.created_at)} · ${n} item${n===1?'':'s'}${o.order_type!=='stock'?' · '+esc(ORDER_TYPE[o.order_type]):''}</div></button>
        <div class="kright"><b>${noPriceItems(o).length?'—':money(o.total_usd)}</b>${rightPill(o)}</div>
        ${nx ? `<button class="kbtn sm ${nx[2]} knext" data-next="${o.id}" data-st="${nx[0]}">${nx[1]}</button>` : '<div class="knext"></div>'}
      </div>`; }).join('');
    $('#olist').querySelectorAll('[data-open]').forEach(b => b.onclick = () => orderDetail(+b.dataset.open));
    $('#olist').querySelectorAll('[data-next]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      if (await setStage(+b.dataset.next, b.dataset.st)){
        const o = all.find(x => x.id === +b.dataset.next); const r = await sb.from('orders').select('status').eq('id', o.id).single();
        o.status = r.data?.status || o.status; toast(`${o.order_no} → ${STAGES[b.dataset.st].label}`); draw();
      } else b.disabled = false;
    });
  };
  $('#fSearch').oninput = () => { clearTimeout(draw._t); draw._t = setTimeout(draw, 200); };
  draw();
}

// one order (like K-TRONiCS: big total, Payment card, items, history, one main button)
async function orderDetail(id){
  const [{ data:o, error }, { data:admins }] = await Promise.all([
    sb.from('orders').select('*, customers(*), order_items(*), payments(*), order_status_log(*)').eq('id', id).single(),
    sb.from('admin_users').select('user_id,full_name,email')]);
  if (fail(error)) return;
  const who = uid => { if (!uid) return 'Customer'; const a = (admins||[]).find(x => x.user_id === uid); return a ? (a.full_name || a.email) : 'Admin'; };
  const c = o.customers || {}, st = stageOf(o.status), bal = balanceOf(o), np = noPriceItems(o), nx = NEXT[st];
  const pays = (o.payments||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const pend = pays.filter(p => p.status === 'pending');
  const pct = Number(o.total_usd) > 0 ? Math.min(100, Number(o.paid_usd) / Number(o.total_usd) * 100) : 0;
  const logs = (o.order_status_log||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const payLbl = np.length ? 'Price not set yet' : bal <= 0 ? 'Fully paid' : Number(o.paid_usd) > 0 ? 'Deposit paid' : 'Not paid yet';
  openModal(`<div id="oView" class="ksheet">
    <div class="ksh">${esc(o.order_no)} · ${esc(custOf(o))}</div>
    <div class="krow"><div class="grow"><div class="kbig">${np.length?'—':money(o.total_usd)}</div><div class="kst">${payLbl} · ${dt(o.created_at)}${o.order_type!=='stock'?' · '+esc(ORDER_TYPE[o.order_type]):''}</div></div>${stagePill(o.status)}</div>

    ${np.length?`<div class="kcard" style="background:var(--k-ors);border-color:transparent;color:var(--k-or)"><b>💬 ${np.length} item${np.length>1?'s have':' has'} no price yet</b>
      <div class="kst" style="color:inherit;white-space:normal">Agree the price with the customer on Telegram, then set it here.</div>
      <button class="kbtn sm" id="oSetPrice">Set prices</button></div>`:''}

    <div class="kcard">
      <div class="krow"><b class="grow">Payment</b><span class="kst" style="margin:0">Paid ${money(o.paid_usd)} of ${np.length?'—':money(o.total_usd)}</span></div>
      <div class="kpaybar"><div style="width:${pct}%"></div></div>
      <div class="krow"><span class="grow">${bal > 0 || np.length ? 'Still owed' : 'Fully paid'}</span><b style="color:${bal > 0 || np.length ? 'var(--k-rd)' : 'var(--k-gr)'}">${np.length?'—':money(Math.max(0,bal))}</b></div>
      ${pays.length?`<div class="kplist">${pays.map(p=>`<div class="krow kpay">
        <div class="grow"><div style="font-weight:700">${money(p.amount_usd)} <span class="kst" style="display:inline">· ${esc(p.payment_kind)}</span></div><div class="kst">${dt(p.created_at)} · ${p.slip_path?'slip from customer':'added by admin'}</div></div>
        ${p.status==='pending'?`<button class="kbtn sm green" onclick="paymentDetail(${p.id})">Check slip</button>`:`<span class="kpill ${p.status==='approved'?'gr':'rd'}">${p.status==='approved'?'Received':'Rejected'}</span><button class="kbtn sm out" onclick="paymentDetail(${p.id})">Open</button>`}
      </div>`).join('')}</div>`:''}
      ${st!=='cancelled' && !np.length && bal > 0 && !pend.length ? `<button class="kbtn green" id="col">💵 Add payment</button>
        <div id="colBox" class="hidden kcol">
          <label style="margin:0">Amount received (cash / transfer)</label>
          <input id="pyAmt" type="number" step="0.01" min="0" value="${bal}">
          <div class="kbtns"><button class="kbtn out" id="pyDep">Deposit</button><button class="kbtn green" id="pyFull">Full ${money(bal)}</button></div>
        </div>` : ''}
    </div>

    <div class="kcard">
      ${(o.order_items||[]).map(i=>`<div class="krow"><div class="grow"><div style="font-weight:600">${esc(i.product_name)}</div><div class="kst">${i.qty} × ${Number(i.unit_price_usd)>0?money(i.unit_price_usd):'<span style="color:var(--k-or)">no price</span>'}</div></div><b>${Number(i.unit_price_usd)>0?money(i.unit_price_usd*i.qty):'—'}</b></div>`).join('')}
      ${+o.delivery_fee_usd?`<div class="krow"><span class="grow kst" style="margin:0">Delivery</span><b>${money(o.delivery_fee_usd)}</b></div>`:''}
    </div>

    <div class="kcard">
      <div class="krow"><div class="grow"><div style="font-weight:700">${esc(custOf(o))}</div>
        ${o.contact_phone?`<div class="kst">📞 ${esc(o.contact_phone)}</div>`:''}${o.delivery_address?`<div class="kst" style="white-space:normal">📍 ${esc(o.delivery_address)}</div>`:''}</div></div>
      <div class="kbtns">${o.contact_phone?`<a class="kbtn sm out" href="tel:${esc(o.contact_phone.replace(/\s/g,''))}">📞 Call</a>`:''}${c.username?`<a class="kbtn sm out" href="https://t.me/${esc(c.username)}" target="_blank">💬 Telegram</a>`:''}</div>
    </div>
    ${o.customer_note?`<div class="knote">📝 ${esc(o.customer_note)}</div>`:''}

    ${logs.length?`<div class="kcard" style="gap:6px">${logs.map(l=>`<div class="krow small"><span class="grow"><b>${esc(STAGES[stageOf(l.new_status)].label)}</b>${l.new_status==='payment_review'?' (slip sent)':''} · ${esc(who(l.changed_by))}</span><span class="kst" style="margin:0">${dt(l.created_at)}</span></div>`).join('')}</div>`:''}

    <div class="kbtns">${nx?`<button class="kbtn ${nx[2]}" id="nx">${nx[1]}</button>`:''}${st!=='cancelled'&&st!=='delivered'?`<button class="kbtn red" id="cx">Cancel order</button>`:''}${st==='cancelled'?`<button class="kbtn out" id="reopen">Re-open order</button>`:''}</div>
    <div class="kbtns"><button class="kbtn out" onclick="orderEdit(${o.id})">✏️ Edit order</button><button class="kbtn out" onclick="closeModal();go('orders')">Close</button></div>
  </div>`);
  const reload = () => orderDetail(o.id);
  if ($('#nx')) $('#nx').onclick = async () => { if (await setStage(o.id, nx[0])){ toast(STAGES[nx[0]].label); reload(); } };
  if ($('#cx')) $('#cx').onclick = async () => { if (await setStage(o.id, 'cancelled', true)){ toast('Order cancelled'); reload(); } };
  if ($('#reopen')) $('#reopen').onclick = async () => { if (await setStage(o.id, 'new')){ toast('Order re-opened'); reload(); } };
  if ($('#oSetPrice')) $('#oSetPrice').onclick = () => orderEdit(o.id);
  if ($('#col')) $('#col').onclick = () => { $('#col').classList.add('hidden'); $('#colBox').classList.remove('hidden'); $('#pyAmt').focus(); };
  const addPay = async (amt, kind) => {
    amt = r2(amt); if (!(amt > 0)) return toast('Enter an amount');
    const r = await sb.from('payments').insert({ order_id:o.id, payment_kind:kind, amount_usd:amt, status:'approved', reviewed_by: await myId(), reviewed_at:new Date().toISOString() });
    if (fail(r.error)) return;
    const paid = await recalcPaid(o.id);
    if (st === 'new' || st === 'confirmed') await sb.from('orders').update({ status: prepStatus({ ...o, paid_usd: paid }) }).eq('id', o.id);   // money received = confirmed
    toast('Payment added'); refreshPills(); reload();
  };
  if ($('#pyDep')) $('#pyDep').onclick = () => { const a = parseFloat($('#pyAmt').value)||0; addPay(a, a >= bal ? (Number(o.paid_usd) > 0 ? 'balance' : 'full') : 'deposit'); };
  if ($('#pyFull')) $('#pyFull').onclick = () => addPay(bal, Number(o.paid_usd) > 0 ? 'balance' : 'full');
}

// ---- item editor (used by edit order + new order) ----
let ED = null;
async function edInit(items, type, fee, deposit){
  const { data: prods } = await sb.from('products').select('id,name,price_usd,cost_usd,is_preorder').order('name');
  ED = { items: items.map(i => ({ id:i.id, product_id:i.product_id, product_name:i.product_name, qty:Number(i.qty), unit_price_usd:Number(i.unit_price_usd), unit_cost_usd: i.unit_cost_usd==null ? null : Number(i.unit_cost_usd) })),
         prods: prods||[], type, fee:Number(fee||0), deposit:Number(deposit||0) };
}
const edSub = () => r2(ED.items.reduce((s,i)=>s+i.qty*i.unit_price_usd,0));
const edCost = () => r2(ED.items.reduce((s,i)=>s+i.qty*(i.unit_cost_usd||0),0));
function edHTML(){
  return `<div class="tablewrap"><table id="edTable"></table></div>
    <div style="display:flex;gap:8px;margin-top:8px"><select id="edAdd" style="flex:1"><option value="">+ Add product…</option>
      ${ED.prods.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price_usd)}${p.is_preorder?' (pre-order)':''}</option>`).join('')}
      <option value="custom">+ Other item (type the name)</option></select><button class="btn" type="button" id="edAddBtn">Add</button></div>
    <div class="row" style="margin-top:4px">
      <div><label>Delivery fee (USD)</label><input id="edFee" type="number" step="0.01" min="0" value="${ED.fee}"></div>
      <div id="edDepWrap"><label>Deposit to pay first (USD)</label><input id="edDep" type="number" step="0.01" min="0" value="${ED.deposit}"></div>
    </div>
    <div id="edTotals" style="margin-top:10px"></div>`;
}
function edBind(){
  const totals = () => {
    ED.fee = Math.max(0, parseFloat($('#edFee').value)||0);
    ED.deposit = Math.max(0, parseFloat($('#edDep').value)||0);
    const sub = edSub();
    const cost = edCost(), prof = r2(sub - cost), miss = ED.items.some(i => i.unit_cost_usd == null);
    $('#edTotals').innerHTML = `<span class="muted">Subtotal ${money(sub)} · Delivery ${money(ED.fee)}</span> · <b>Total ${money(sub+ED.fee)}</b><br>
      <span class="muted">Cost ${money(cost)} · </span><b style="color:${prof<0?'var(--bad)':'var(--ok)'}">${prof<0?'Loss':'Profit'} ${money(Math.abs(prof))}</b>${miss?' <span class="muted" style="font-size:12px">(some items have no cost)</span>':''}`;
  };
  const draw = () => {
    $('#edTable').innerHTML = `<thead><tr><th>Item</th><th style="width:70px">Qty</th><th style="width:92px">Cost $</th><th style="width:92px">Price $</th><th style="width:80px;text-align:right">Total</th><th style="width:40px"></th></tr></thead><tbody>
      ${ED.items.map((it,i)=>`<tr>
        <td><input data-i="${i}" data-f="product_name" value="${esc(it.product_name)}"></td>
        <td><input data-i="${i}" data-f="qty" type="number" min="1" value="${it.qty}"></td>
        <td><input data-i="${i}" data-f="unit_cost_usd" type="number" step="0.01" min="0" value="${it.unit_cost_usd??''}" placeholder="—"></td>
        <td><input data-i="${i}" data-f="unit_price_usd" type="number" step="0.01" min="0" value="${it.unit_price_usd}"></td>
        <td style="text-align:right" id="edL${i}">${money(it.qty*it.unit_price_usd)}</td>
        <td><button class="btn sm bad" type="button" data-del="${i}" title="Remove">×</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No items — add one below</td></tr>'}</tbody>`;
    $('#edTable').querySelectorAll('input').forEach(inp => inp.oninput = () => {
      const it = ED.items[+inp.dataset.i], f = inp.dataset.f;
      it[f] = f==='product_name' ? inp.value : f==='qty' ? Math.max(1, parseInt(inp.value)||1) : f==='unit_cost_usd' ? (inp.value===''?null:Math.max(0, parseFloat(inp.value)||0)) : Math.max(0, parseFloat(inp.value)||0);
      $('#edL'+inp.dataset.i).textContent = money(it.qty*it.unit_price_usd); totals();
    });
    $('#edTable').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { ED.items.splice(+b.dataset.del, 1); draw(); });
    totals();
  };
  $('#edFee').oninput = totals; $('#edDep').oninput = totals;
  $('#edAddBtn').onclick = () => {
    const v = $('#edAdd').value; if (!v) return;
    if (v === 'custom') ED.items.push({ product_id:null, product_name:'', qty:1, unit_price_usd:0, unit_cost_usd:null });
    else {
      const p = ED.prods.find(x => x.id == v);
      const ex = ED.items.find(i => i.product_id === p.id);
      if (ex) ex.qty++; else ED.items.push({ product_id:p.id, product_name:p.name, qty:1, unit_price_usd:Number(p.price_usd), unit_cost_usd: p.cost_usd==null?null:Number(p.cost_usd) });
    }
    $('#edAdd').value = ''; draw();
  };
  ED.showDep = () => $('#edDepWrap').classList.toggle('hidden', ED.type === 'stock');
  ED.showDep(); draw();
}
// write item changes
async function edSave(orderId, origItems){
  if (ED.items.some(i => !String(i.product_name).trim())) { toast('Every item needs a name'); return false; }
  const keep = new Set(ED.items.filter(i => i.id).map(i => i.id));
  const del = origItems.filter(i => !keep.has(i.id)).map(i => i.id);
  if (del.length){ const r = await sb.from('order_items').delete().in('id', del); if (fail(r.error)) return false; }
  for (const i of ED.items){
    const row = { product_id: i.product_id, product_name: String(i.product_name).trim(), qty: i.qty, unit_price_usd: i.unit_price_usd, unit_cost_usd: i.unit_cost_usd };
    const r = i.id ? await sb.from('order_items').update(row).eq('id', i.id) : await sb.from('order_items').insert({ ...row, order_id: orderId });
    if (fail(r.error)) return false;
  }
  return true;
}

  };

async function newOrder(){

  openModal(`

    <div class="section">
      <label>Admin note</label><input id="nNote">
      <div class="check"><input type="checkbox" id="nPaid"><label for="nPaid" style="margin:0;color:var(--text)">Customer already paid in full</label></div>
    </div>

    $('#nPhone').value = c?.phone || ''; $('#nAddr').value = c?.address || '';

      customer_id: +custId, order_type: type, contact_name: name, contact_phone: phone||null, delivery_address: addr||null,
      subtotal_usd: sub, delivery_fee_usd: ED.fee, total_usd: total, deposit_usd: type==='stock' ? 0 : ED.deposit,
      admin_note: $('#nNote').value.trim() || null
    }).select('id').single();
    if (fail(r.error)){ btn.disabled = false; return; }
    const oid = r.data.id;
    const ri = await sb.from('order_items').insert(ED.items.map(i => ({ order_id: oid, product_id: i.product_id, product_name: String(i.product_name).trim(), qty: i.qty, unit_price_usd: i.unit_price_usd, unit_cost_usd: i.unit_cost_usd })));
    if (fail(ri.error)){ btn.disabled = false; return; }
    if ($('#nPaid').checked && total > 0){
      const me = await myId();
      await sb.from('payments').insert({ order_id: oid, payment_kind:'full', amount_usd: total, status:'approved', reviewed_by: me, reviewed_at: new Date().toISOString() });
      await sb.from('orders').update({ paid_usd: total, status: type==='stock' ? 'paid' : 'deposit_paid' }).eq('id', oid);
    }
    toast('Order created'); closeModal(); orderDetail(oid);
  };
}

async function deletePayment(pid, orderId){
  if (!confirm('Delete this payment? If it was approved, the paid amount of the order goes down.')) return;
  const { data:p } = await sb.from('payments').select('slip_path').eq('id', pid).maybeSingle();
  const { error } = await sb.from('payments').delete().eq('id', pid);
  if (fail(error)) return;
  if (p?.slip_path) await sb.storage.from('payment-slips').remove([p.slip_path]);
  await recalcPaid(orderId);
  toast('Payment deleted'); refreshPills();
  if (!$('#modal').classList.contains('hidden') && $('#oSave')) orderEdit(orderId);
  else if (!$('#modal').classList.contains('hidden') && $('#oView')) orderDetail(orderId); else { closeModal(); go(page); }
}

    const v = vals(); if (!(v.amount_usd > 0)) return toast('Enter an amount');
    $('#pApp').disabled = true;
    let { error } = await sb.from('payments').update({ ...v, status:'approved', reject_reason:null, reviewed_by:me, reviewed_at:new Date().toISOString() }).eq('id', id);
    if (fail(error)) return;
    await recalcPaid(o.id);
    const paidNow = await recalcPaid(o.id);
    const next = stageOf(o.status) === 'new' ? (paidNow >= Number(o.total_usd) ? 'paid' : 'deposit_paid') : o.status;
    ({ error } = await sb.from('orders').update({ status: next }).eq('id', o.id));
    if (fail(error)) return;
    toast('Payment approved'); closeModal(); refreshPills(); go(page);
  };
  if ($('#pRej')) $('#pRej').onclick = async () => {
    const reason = $('#rReason').value.trim();
    if (!reason) return toast('Please write a reject reason');
    let { error } = await sb.from('payments').update({ status:'rejected', reject_reason:reason, reviewed_by:me, reviewed_at:new Date().toISOString() }).eq('id', id);
    if (fail(error)) return;
    ({ error } = await sb.from('orders').update({ status:'pending_payment' }).eq('id', o.id));
    if (fail(error)) return;
    toast('Payment rejected'); closeModal(); refreshPills(); go(page);
  };
}

function catFromFolder(folder){
  // "06 Hair Care" -> "Hair Care" ; "02 Cosmetics (Makeup)" -> "Cosmetics"
  return folder.replace(/^\s*\d+\s*[-_.]?\s*/, '').replace(/\s*\(.*\)\s*$/, '').trim();
}
async function bulkUpload(){
  await loadCats();
  openModal(`
    <h3>📷 Bulk upload photos</h3>
    <p class="muted" style="font-size:13px;margin-top:0">Every photo becomes its own product in the shop. Until you set a price, customers see <b>"Ask price"</b> — they can still order it, and you agree the price with them on Telegram. Afterwards open each one and set the real name, cost and selling price.</p>
    <div class="card" style="padding:12px;margin:10px 0">
      <b>A) On a computer — whole folder (recommended)</b>
      <div class="muted" style="font-size:13px;margin:4px 0 8px">Choose the unzipped folder <b>K-BEAUTICS Product Photos</b>. Each sub-folder becomes a category
        (missing categories are created automatically). The "Videos" folder is skipped.</div>
      <input type="file" id="bDir" webkitdirectory directory multiple>
    </div>
    <label class="check" style="display:flex;gap:8px;align-items:flex-start;margin:6px 0 4px;color:var(--text)"><input type="checkbox" id="bRep" style="margin-top:3px">
      <span><b>Replace photos</b> of products that already exist (same file name, e.g. <i>Skincare-001</i>). Use this for cleaned photos. Name, prices and other photos stay the same.</span></label>
    <div class="card" style="padding:12px;margin:10px 0">
      <b>B) On a phone — pick photos for one category</b>
      <label>Category</label><select id="bCat">${CATS.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      <input type="file" id="bFiles" accept="image/*" multiple style="margin-top:8px">
    </div>
    <div id="bProg" class="hidden" style="margin-top:8px">
      <div style="height:12px;background:#f3d6e0;border-radius:8px;overflow:hidden"><div id="bBar" style="height:100%;width:0;background:var(--brand)"></div></div>
      <div id="bTxt" class="muted" style="font-size:13px;margin-top:6px"></div>
    </div>
    <div class="mfoot"><button class="btn" id="bClose" onclick="closeModal();go('products')">Close</button></div>`);
  const isImg = f => /\.(jpe?g|png|webp|gif|heic)$/i.test(f.name) || (f.type||'').startsWith('image/');
  async function run(jobs){ // jobs: [{file, catName?, catId?}]
    if (!jobs.length) return toast('No photos found');
    $('#bDir').disabled = $('#bFiles').disabled = true; $('#bProg').classList.remove('hidden');
    // 1) create missing categories
    let maxSort = Math.max(0, ...CATS.map(c=>c.sort_order||0));
    const byName = {}; CATS.forEach(c => byName[c.name.toLowerCase()] = c.id);
    for (const j of jobs) if (!j.catId && j.catName){
      const k = j.catName.toLowerCase();
      if (!byName[k]){
        const r = await sb.from('categories').insert({ name: j.catName, sort_order: ++maxSort, is_active: true }).select('id').single();
        if (fail(r.error)) return; byName[k] = r.data.id; toast('Category created: ' + j.catName);
      }
      j.catId = byName[k];
    }
    // 2) skip photos already uploaded (same name)
    const { data: ex } = await sb.from('products').select('id,name,images');
    const have = new Set((ex||[]).map(p => p.name.toLowerCase()));
    const byPName = {}; (ex||[]).forEach(p => byPName[p.name.toLowerCase()] = p);
    const replace = $('#bRep').checked;
    let done = 0, made = 0, skipped = 0, failed = 0, replaced = 0;
    const show = () => { $('#bBar').style.width = Math.round(done/jobs.length*100)+'%';
      $('#bTxt').textContent = `${done} / ${jobs.length} — added ${made}${replaced?', photo replaced '+replaced:''}, already there ${skipped}${failed?', failed '+failed:''}`; };
    const queue = [...jobs];
    async function worker(){
      while (queue.length){
        const j = queue.shift(); const name = j.file.name.replace(/\.[^.]+$/, '');
        const old = byPName[name.toLowerCase()];
        if (old && replace){
          const url = await uploadImage(j.file);
          if (!url) failed++;
          else {
            const imgs = [url, ...((old.images||[]).slice(1))];
            const { error } = await sb.from('products').update({ images: imgs }).eq('id', old.id);
            if (error){ console.error(error); failed++; } else replaced++;
          }
        }
        else if (have.has(name.toLowerCase())) skipped++;
        else {
          const url = await uploadImage(j.file);
          if (!url) failed++;
          else {
            const { error } = await sb.from('products').insert({ name, price_usd: 0, category_id: j.catId || null, images: [url], is_active: true, is_preorder: false });
            if (error){ console.error(error); failed++; } else { made++; have.add(name.toLowerCase()); }
          }
        }
        done++; show();
      }
    }
    show(); await Promise.all([worker(), worker(), worker()]);
    $('#bTxt').innerHTML += replace && replaced ? `<br><b>Finished ✅</b> ${replaced} photos replaced.` : '<br><b>Finished ✅</b> Products are in the shop with "Ask price" — set name & prices when you are ready.' + (failed ? ' Run it again to retry the failed ones.' : '');
    $('#bDir').disabled = $('#bFiles').disabled = false;
  }
  $('#bDir').onchange = e => {
    const jobs = [];
    for (const f of e.target.files){
      if (!isImg(f)) continue;
      const parts = (f.webkitRelativePath || f.name).split('/');
      const folder = parts.length > 2 ? parts[parts.length-2] : '';
      if (!folder || /video/i.test(folder)) continue;
      jobs.push({ file: f, catName: catFromFolder(folder) });
    }
    jobs.sort((a,b) => a.file.name.localeCompare(b.file.name));
    if (!confirm($('#bRep').checked ? `Upload ${jobs.length} photos and replace the photo of products with the same name?` : `Upload ${jobs.length} photos into ${new Set(jobs.map(j=>j.catName)).size} categories?`)) return;
    run(jobs);
  };
  $('#bFiles').onchange = e => run([...e.target.files].filter(isImg).map(f => ({ file: f, catId: +$('#bCat').value })));
}

async function moveCat(i, d){
  const list = CATS.map(c => ({ c })); list.splice(PRE_POS, 0, { pre:true });
  const j = i + d; if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  let k = 0, pre = 0;
  for (let n = 0; n < list.length; n++){
    if (list[n].pre){ pre = n; continue; }
    k++;
    if (list[n].c.sort_order !== k){ const { error } = await sb.from('categories').update({ sort_order: k }).eq('id', list[n].c.id); if (fail(error)) return; }
  }
  if (pre !== PRE_POS){ const { error } = await sb.from('shop_settings').update({ preorder_sort: pre }).eq('id', 1); if (fail(error)) return; }
  go('categories');
}

// ====== REPORTS (profit & loss) ======
const CONFIRMED = ['paid','deposit_paid','ordered_taobao','shipping','arrived','ready','delivered'];
const dkey = d => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
const dlabel = k => fmtD(k + 'T00:00:00');
function periodRange(p, from, to){
  const n = new Date(), d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const add = (d, days) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + days);
  switch (p){
    case 'today': return [d0, add(d0,1)];
    case 'yesterday': return [add(d0,-1), d0];
    case 'week': { const w = (d0.getDay() + 6) % 7; return [add(d0,-w), add(d0,1)]; }
    case 'month': return [new Date(n.getFullYear(), n.getMonth(), 1), add(d0,1)];
    case 'lastmonth': return [new Date(n.getFullYear(), n.getMonth()-1, 1), new Date(n.getFullYear(), n.getMonth(), 1)];
    case 'year': return [new Date(n.getFullYear(), 0, 1), add(d0,1)];
    case 'custom': { const f = from ? new Date(from+'T00:00:00') : d0, t = to ? add(new Date(to+'T00:00:00'),1) : add(d0,1); return [f, t]; }
  }
  return [d0, add(d0,1)];
}
async function profitData(from, to, mode='confirmed'){
  let q = sb.from('orders').select('id,order_no,status,order_type,created_at,subtotal_usd,delivery_fee_usd,total_usd,paid_usd,order_items(product_id,product_name,qty,unit_price_usd,unit_cost_usd)')
    .gte('created_at', from.toISOString()).lt('created_at', to.toISOString()).neq('status','cancelled').limit(10000);
  if (mode === 'confirmed') q = q.in('status', CONFIRMED);
  const [{ data: os, error }, { data: pays }] = await Promise.all([q,
    sb.from('payments').select('amount_usd').eq('status','approved').gte('reviewed_at', from.toISOString()).lt('reviewed_at', to.toISOString())]);
  if (fail(error)) return null;
  const R = { orders:0, sales:0, cost:0, fees:0, unpaid:0, noCost:0, received: r2((pays||[]).reduce((s,x)=>s+Number(x.amount_usd),0)), days:{}, prods:{}, list:[] };
  for (const o of os||[]){
    let sales = 0, cost = 0;
    for (const i of o.order_items||[]){
      const s = Number(i.unit_price_usd) * i.qty, c = Number(i.unit_cost_usd||0) * i.qty;
      if (i.unit_cost_usd == null) R.noCost++;
      sales += s; cost += c;
      const k = i.product_id ? 'p'+i.product_id : 'n'+i.product_name;
      const P = R.prods[k] ||= { name: i.product_name, qty:0, sales:0, cost:0 };
      P.qty += i.qty; P.sales += s; P.cost += c;
    }
    const D = R.days[dkey(o.created_at)] ||= { orders:0, sales:0, cost:0 };
    D.orders++; D.sales += sales; D.cost += cost;
    R.orders++; R.sales += sales; R.cost += cost; R.fees += Number(o.delivery_fee_usd||0);
    R.unpaid += Math.max(0, Number(o.total_usd) - Number(o.paid_usd));
    R.list.push({ ...o, sales, cost });
  }
  R.profit = r2(R.sales - R.cost);
  return R;
}

      <div class="card tablewrap" style="margin-bottom:12px"><h3 style="margin-top:0">By day</h3>
        ${days.length?`<table><thead><tr><th>Date</th><th>Orders</th><th>Sales</th><th>Cost</th><th>Profit</th><th class="hide-m" style="width:30%"></th></tr></thead><tbody>
        ${days.map(([k,d])=>{ const pf = r2(d.sales-d.cost); return `<tr><td>${dlabel(k)}</td><td>${d.orders}</td><td>${money(d.sales)}</td><td>${money(d.cost)}</td><td>${pl(pf)}</td>

      <div class="card tablewrap" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">By product</h3>${prods.length?'<button class="btn sm" id="rpCsv">Download Excel (CSV)</button>':''}</div>
        ${prods.length?`<table style="margin-top:8px"><thead><tr><th>Product</th><th>Qty sold</th><th>Sales</th><th>Cost</th><th>Profit</th></tr></thead><tbody>
        ${prods.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.sales)}</td><td>${money(x.cost)}</td><td>${pl(r2(x.sales-x.cost))}</td></tr>`).join('')}

        </tbody></table>`:'<div class="empty">No orders</div>'}</div>`;
    if ($('#rpCsv')) $('#rpCsv').onclick = () => {
      const rows = [['Product','Qty sold','Sales USD','Cost USD','Profit USD'], ...prods.map(x=>[x.name, x.qty, r2(x.sales), r2(x.cost), r2(x.sales-x.cost)]),

  let c = { first_name:'', last_name:'', phone:'', address:'', note:'', orders:[] };
  if (id){ const r = await sb.from('customers').select('*, orders(id,order_no,status,total_usd,created_at)').eq('id', id).single(); if (fail(r.error)) return; c = r.data; }
  const os = (c.orders||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  openModal(`
    <h3>${id?'Customer':'Add customer'}</h3>
    ${id?`<div class="muted">${c.telegram_id?`Telegram${c.username?` <a class="link" href="https://t.me/${esc(c.username)}" target="_blank">@${esc(c.username)}</a>`:''}`:'Added by admin'} · since ${dt(c.created_at)}</div>`:''}
    <div class="row">
      <div><label>First name</label><input id="cuF" value="${esc(c.first_name||'')}"></div>
      <div><label>Last name</label><input id="cuL" value="${esc(c.last_name||'')}"></div>
    </div>
    <label>Phone</label><input id="cuP" value="${esc(c.phone||'')}">
    <label>Address</label><textarea id="cuA">${esc(c.address||'')}</textarea>
    <label>Note (only admins see this)</label><input id="cuN" value="${esc(c.note||'')}">
    ${id?`<div class="section"><h4>Orders (${os.length})</h4>${os.map(o=>`<div class="click" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="closeModal();orderDetail(${o.id})"><span><b>${esc(o.order_no)}</b> ${badge(o.status,ORDER_STATUS)}</span><span>${money(o.total_usd)}</span></div>`).join('') || '<div class="muted">No orders</div>'}</div>`:''}
    <div class="mfoot">${id?'<button class="btn bad" id="cuDel" style="margin-right:auto">Delete</button>':''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="cuSave">Save</button></div>`);
  $('#cuSave').onclick = async () => {
    const row = { first_name: $('#cuF').value.trim()||null, last_name: $('#cuL').value.trim()||null, phone: $('#cuP').value.trim()||null, address: $('#cuA').value.trim()||null, note: $('#cuN').value.trim()||null };
    if (!row.first_name && !row.last_name) return toast('Enter a name');
    const { error } = id ? await sb.from('customers').update(row).eq('id', id) : await sb.from('customers').insert(row);
    if (fail(error)) return; toast('Customer saved'); closeModal(); go('customers');
  };
  if (id) $('#cuDel').onclick = async () => {
    if (os.length) return toast('This customer has orders — delete their orders first');
    if (!confirm('Delete this customer?')) return;
    await sb.from('taobao_requests').delete().eq('customer_id', id);
    const { error } = await sb.from('customers').delete().eq('id', id);
    if (fail(error)) return; toast('Customer deleted'); closeModal(); go('customers');
  };
}

// ====== ADMINS (staff logins) ======
async function admins(){
  const { data, error } = await sb.from('admin_users').select('*').order('created_at');
  if (fail(error)) return;
  const owner = ME?.role === 'owner';
  $('#main').innerHTML = `
    <div class="top"><h2>Admins</h2><div class="filters"><button class="btn" onclick="passwordForm()">Change my password</button>${owner?'<button class="btn primary" onclick="adminForm()">+ Add admin</button>':''}</div></div>
    <p class="muted" style="margin-top:-6px">People who can sign in to this admin web. <b>Owner</b> can manage admins; <b>Staff</b> can do everything else.</p>
    <div class="card tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th class="hide-m">Added</th></tr></thead><tbody>
      ${(data||[]).map(a=>`<tr class="${owner?'click':''}" ${owner?`onclick="adminForm('${a.user_id}')"`:''}><td><b>${esc(a.full_name||'—')}</b>${a.user_id===ME?.user_id?' <span class="muted">(you)</span>':''}</td><td>${esc(a.email||'—')}</td><td>${a.role==='owner'?'<span class="badge b-arrived">Owner</span>':'<span class="badge">Staff</span>'}</td><td class="hide-m muted">${dt(a.created_at)}</td></tr>`).join('')}
    </tbody></table></div>`;
  window._admins = data || [];
}
function passwordForm(){
  openModal(`<h3>Change my password</h3>
    <label>New password (at least 6 characters)</label><input id="pw1" type="password">
    <label>Type it again</label><input id="pw2" type="password">
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="pwSave">Save</button></div>`);
  $('#pwSave').onclick = async () => {
    const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 6) return toast('At least 6 characters'); if (a !== b) return toast('The two passwords are different');
    const { error } = await sb.auth.updateUser({ password: a });
    if (fail(error)) return; toast('Password changed'); closeModal();
  };
}
function adminForm(uid){
  const a = (window._admins||[]).find(x => x.user_id === uid);
  const self = a && a.user_id === ME?.user_id;
  openModal(`
    <h3>${a?'Edit admin':'Add admin'}</h3>
    <label>Name</label><input id="adN" value="${esc(a?.full_name||'')}">
    ${a?`<label>Email</label><input value="${esc(a.email||'')}" disabled>`:`
    <label>Email (they sign in with this)</label><input id="adE" type="email">
    <label>Password (at least 6 characters — give it to them)</label><input id="adP" type="text">`}
    <label>Role</label><select id="adR" ${self?'disabled':''}><option value="staff" ${a?.role!=='owner'?'selected':''}>Staff</option><option value="owner" ${a?.role==='owner'?'selected':''}>Owner</option></select>
    ${!a?'<div class="muted" style="font-size:13px;margin-top:8px">If email confirmation is turned on in Supabase, they must click the link in the email before they can sign in.</div>':''}
    <div class="mfoot">${a&&!self?'<button class="btn bad" id="adDel" style="margin-right:auto">Remove access</button>':''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="adSave">${a?'Save':'Create login'}</button></div>`);
  $('#adSave').onclick = async () => {
    const name = $('#adN').value.trim() || null, role = $('#adR').value;
    if (a){
      const { error } = await sb.from('admin_users').update(self ? { full_name:name } : { full_name:name, role }).eq('user_id', a.user_id);
      if (fail(error)) return; toast('Saved'); closeModal(); go('admins'); return;
    }
    const email = $('#adE').value.trim(), password = $('#adP').value;
    if (!email) return toast('Enter an email');
    if (password.length < 6) return toast('Password must be at least 6 characters');
    $('#adSave').disabled = true;
    const tmp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession:false, autoRefreshToken:false, storageKey:'kb-signup' } });
    const { data, error } = await tmp.auth.signUp({ email, password });
    if (fail(error)){ $('#adSave').disabled = false; return; }
    if (!data.user || (data.user.identities && data.user.identities.length === 0)){
      $('#adSave').disabled = false; return toast('This email already has an account — use another email');
    }
    const r = await sb.from('admin_users').insert({ user_id: data.user.id, full_name: name, role, email });
    if (fail(r.error)){ $('#adSave').disabled = false; return; }
    toast('Admin added'); closeModal(); go('admins');
  };
  if ($('#adDel')) $('#adDel').onclick = async () => {
    if (!confirm(`Remove admin access for ${a.email || a.full_name}?`)) return;
    const { error } = await sb.from('admin_users').delete().eq('user_id', a.user_id);
    if (fail(error)) return; toast('Access removed'); closeModal(); go('admins');
  };
}

// ====== SETTINGS ======
async function settings(){
  const { data:s, error } = await sb.from('shop_settings').select('*').eq('id',1).single();
  if (fail(error)) return;
  let qr = s.qr_image_url;
  $('#main').innerHTML = `
    <div class="top"><h2>Shop settings</h2></div>
    <div class="card" style="max-width:620px">
      <label>Shop name</label><input id="sName" value="${esc(s.shop_name)}">
      <label>📝 Small text above every price in the shop (leave empty to hide)</label>
      <input id="sPNote" value="${esc(s.price_note||'')}" placeholder="e.g. Wholesale price — see photo">
      <label>💬 Your Telegram username for customers to chat (ask price, questions)</label>
      <input id="sTg" value="${esc(s.contact_telegram||'')}" placeholder="e.g. kbeautics_shop  (without @)">
      <div class="muted" style="font-size:12px;margin-top:4px">Customers tap "Chat with us" in the shop and it opens a Telegram chat with this account.</div>
      <div class="section"><h4>Bank transfer details (shown at checkout)</h4>
        <div class="row">
          <div><label>Bank</label><input id="sBank" value="${esc(s.bank_name||'')}" placeholder="e.g. ABA"></div>
          <div><label>Account name</label><input id="sAccName" value="${esc(s.account_name||'')}"></div>
        </div>
        <label>Account number</label><input id="sAccNo" value="${esc(s.account_number||'')}">
        <label>Payment QR code image</label>
        <div class="imgs" id="sQr"></div>
        <input type="file" id="sQrFile" accept="image/*" style="margin-top:8px">
      </div>
      <div class="section"><h4>Orders</h4>
        <div class="row">
          <div><label>Delivery fee (USD)</label><input id="sFee" type="number" step="0.01" min="0" value="${s.delivery_fee_usd}"></div>
          <div><label>Default pre-order deposit %</label><input id="sDep" type="number" min="0" max="100" value="${s.default_deposit_percent}"></div>
        </div>
      </div>
      <div class="section"><h4>⚡ Flash sale</h4>
        <div class="muted" style="font-size:13px">Set a flash price on products (Products page), then choose when the sale ends. The shop shows a countdown; when it ends, normal prices come back automatically.</div>
        <div class="row" style="align-items:end">
          <div><label>Flash sale ends at</label><input id="sFlash" type="datetime-local" value="${s.flash_sale_ends_at?toLocalInput(s.flash_sale_ends_at):''}"></div>
          <div><button class="btn" id="sFlashOff" type="button">No flash sale (clear)</button></div>
        </div>
        <div id="sFlashInfo" class="muted" style="font-size:13px;margin-top:6px"></div>
      </div>
      <div class="mfoot"><button class="btn primary" id="sSave">Save settings</button></div>
    </div>`;
  const drawQr = () => $('#sQr').innerHTML = qr ? `<div class="im"><img src="${esc(qr)}"><button id="qrX">×</button></div>` : '<span class="muted">No QR uploaded</span>';
  const bindX = () => { const x = $('#qrX'); if (x) x.onclick = () => { qr = null; drawQr(); bindX(); }; };
  drawQr(); bindX();
  const flashInfo = () => { const v = $('#sFlash').value; $('#sFlashInfo').textContent = !v ? 'No flash sale running.' : new Date(v) > new Date() ? 'Flash sale is ON until ' + fmtD(v,{t:1,y:1}) : 'This time has passed — flash sale is OFF.'; };
  $('#sFlash').oninput = flashInfo; flashInfo();
  $('#sFlashOff').onclick = () => { $('#sFlash').value = ''; flashInfo(); };
  $('#sQrFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; toast('Uploading…'); const u = await uploadImage(f,'settings'); if (u){ qr=u; drawQr(); bindX(); } };
  $('#sSave').onclick = async () => {
    const { error } = await sb.from('shop_settings').update({
      shop_name: $('#sName').value.trim() || 'K-BEAUTICS',
      price_note: $('#sPNote').value.trim() || null,
      contact_telegram: $('#sTg').value.trim().replace(/^@/,'').replace(/^https?:\/\/t\.me\//,'') || null, bank_name: $('#sBank').value.trim()||null,
      account_name: $('#sAccName').value.trim()||null, account_number: $('#sAccNo').value.trim()||null,
      qr_image_url: qr, delivery_fee_usd: parseFloat($('#sFee').value)||0,
      default_deposit_percent: Math.min(100, Math.max(0, parseInt($('#sDep').value)||0)),
      flash_sale_ends_at: $('#sFlash').value ? new Date($('#sFlash').value).toISOString() : null
    }).eq('id',1);
    if (fail(error)) return; toast('Settings saved');
  };
}

start();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
